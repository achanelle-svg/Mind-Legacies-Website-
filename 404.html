<style>
:root{
  --deep:#0C1519; --panel:#162127; --line:#3A3534; --bronze:#CF9D7B; --stone:#8B908E; --white:#F4F1EC;
  --font-display:'Fraunces', serif; --font-body:'Manrope', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);background:var(--deep);color:var(--white);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
header.site-nav{padding:24px 0;border-bottom:1px solid rgba(139,144,142,0.15);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:0 32px;}
.logo{font-family:var(--font-display);font-size:1.3rem;letter-spacing:0.03em;font-weight:500;}
.logo span{color:var(--bronze);}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 32px;}
.not-found{text-align:center;max-width:560px;}
.not-found .code{font-family:var(--font-display);font-size:clamp(4rem,10vw,6rem);font-weight:500;color:var(--bronze);line-height:1;margin-bottom:18px;}
.not-found h1{font-family:var(--font-display);font-size:clamp(1.6rem,3vw,2.1rem);font-weight:500;margin-bottom:18px;line-height:1.3;}
.not-found p{color:rgba(244,241,236,0.78);font-size:1.02rem;margin-bottom:38px;}
.cta-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-block;padding:14px 30px;font-size:0.95rem;letter-spacing:0.02em;border-radius:2px;transition:all 0.2s;font-weight:500;}
.btn-primary{background:var(--bronze);color:var(--deep);}
.btn-primary:hover{background:#DDB08D;}
.btn-secondary{border:1px solid rgba(244,241,236,0.4);color:var(--white);}
.btn-secondary:hover{border-color:var(--bronze);color:var(--bronze);}
footer{padding:30px 0;border-top:1px solid rgba(139,144,142,0.15);text-align:center;font-size:0.82rem;color:var(--stone);}
</style>

<body>

<header class="site-nav" aria-label="Primary navigation">
  <div class="nav-inner">
    <a href="index.html" class="logo">MIND <span>LEGACIES</span></a>
  </div>

<main>

      <a href="mailto:Info@MindLegacies.com" class="btn btn-secondary">Contact Us</a>
    </div>
  </div>
</main>

<footer>
