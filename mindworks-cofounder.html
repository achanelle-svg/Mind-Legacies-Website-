<style>
:root{--forest:#0B2A22;--obsidian:#0A0F0E;--copper:#B87333;--gold:#D4AF7C;--parchment:#E8DCC6;--soft:#BFB29C;--error:#E39A82;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 70% at 70% 0%,rgba(120,76,38,.6) 0%,rgba(120,76,38,0) 65%),linear-gradient(180deg,#13261f 0%,var(--forest) 45%,var(--obsidian) 100%);background-color:var(--obsidian);color:var(--parchment);font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.gate{width:100%;max-width:440px;border:1px solid rgba(184,115,51,.45);padding:44px 32px;position:relative;text-align:center;background:rgba(10,15,14,.55)}
.gate::before,.gate::after{content:"";position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;background:var(--copper);transform:rotate(45deg)}
.gate::before{top:-5px}.gate::after{bottom:-5px}
img{width:84px;display:block;margin:0 auto 18px}
.name{font-family:"Playfair Display",Georgia,serif;letter-spacing:.16em;color:var(--copper);font-size:1.6rem}
.sub{font-size:.62rem;letter-spacing:.5em;text-transform:uppercase;margin-top:4px}
.eyebrow{font-size:.66rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:34px 0 10px}
p{font-size:.9rem;font-weight:300;color:var(--soft);line-height:1.6;margin:0 0 22px}
label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
input{width:100%;font:inherit;font-size:1rem;letter-spacing:.12em;text-align:center;text-transform:uppercase;color:var(--parchment);background:rgba(10,15,14,.7);border:1px solid rgba(184,115,51,.35);border-radius:0;padding:14px}
input:focus{outline:none;border-color:var(--copper)}
button{margin-top:16px;width:100%;font:inherit;font-size:.76rem;letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:var(--parchment);background:transparent;border:1px solid var(--copper);padding:15px;cursor:pointer}
button:hover{background:var(--copper);color:var(--obsidian)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.err{color:var(--error);font-size:.84rem;min-height:1.3em;margin-top:12px}
.foot{margin-top:30px;font-size:.58rem;letter-spacing:.38em;text-transform:uppercase;color:var(--gold)}
</style></head>

function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open(pk){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pk),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){html=html.split("__FORMSPREE__").join(FORMSPREE);document.open();document.write(html);document.close();}
var f=document.getElementById("gate"),inp=document.getElementById("pk"),err=document.getElementById("err"),btn=document.getElementById("go");
var saved=null;try{saved=sessionStorage.getItem("mw-pk")}catch(e){}
if(saved){open(saved).then(show).catch(function(){try{sessionStorage.removeItem("mw-pk")}catch(e){}})}
inp.focus();
f.addEventListener("submit",function(e){
  e.preventDefault();
  var pk=inp.value.trim().toUpperCase();
  if(!pk){err.textContent="Please enter your passkey.";return}
  btn.disabled=true;btn.textContent="Checking…";err.textContent="";
  open(pk).then(function(html){try{sessionStorage.setItem("mw-pk",pk)}catch(e){}show(html)})
  .catch(function(){btn.disabled=false;btn.textContent="Enter portal";err.textContent="That passkey doesn’t match. Check your invitation email and try again.";inp.select()});
});
})();
